<text x="500" y="27" font-size="12.5" text-anchor="middle" style="fill:var(--term-muted)">premerge demo: two agents, one working tree</text>
<text x="20" y="67" font-size="12.5" class="mono" style="fill:var(--term-fg);white-space:pre" xml:space="preserve">$ premerge save --branch agent-a/cart -m "Cart total with discounts and a first unit test" -- src/cart.js test/cart.t…</text>
